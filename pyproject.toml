[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gaia-bms"
version = "2.0.0"
description = "GAIA - battery management system simulator: PyBaMM cell physics, BMS algorithms, protection and fault injection, with a desktop studio."
readme = "README.md"
requires-python = ">=3.9,<3.13"
license = { text = "MIT" }
authors = [{ name = "Muhamad Alif Izzuwan Bin Ibrahim" }]
dependencies = ["numpy>=1.21", "scipy>=1.7", "pybamm>=23.1", "pandas>=1.3"]

[project.optional-dependencies]
studio = ["pywebview>=5"]
figures = ["matplotlib>=3.5"]
xiloop = ["xiloop"]
dev = ["pytest>=7", "matplotlib>=3.5"]

[project.scripts]
gaia = "gaia.cli:main"

[project.gui-scripts]
gaia-studio = "gaia.studio_app:main"

[tool.setuptools.packages.find]
include = ["gaia*"]

[tool.setuptools.package-data]
gaia = ["data/*", "studio/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

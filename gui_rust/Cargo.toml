[package]
name = "gaia-gui"
version = "0.1.0"
edition = "2021"
description = "GAIA BMS Simulator — Rust/egui GUI frontend"

[[bin]]
name = "gaia-gui"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.28", default-features = true }
egui_plot = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
strip = true
